<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FormVault GVP — Control de Vidrios y Plásticos</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #F2EFEA; --accent: #7A6332; --text: #2C2820; --white: #FFF; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); margin: 0; }
        .header { background: #1B1915; color: var(--white); padding: 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 50; }
        .content { padding: 15px; max-width: 800px; margin: 0 auto; }
        .sheet-card { background: #FFF; border: 1px solid #DDD; padding: 15px; margin-bottom: 10px; border-radius: 8px; cursor: pointer; }
        .btn { padding: 10px 15px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; }
        .btn-accent { background: var(--accent); color: white; }
        .inspect-row { background: white; padding: 12px; border-bottom: 1px solid #EEE; display: flex; justify-content: space-between; align-items: center; }
        .status-pill { padding: 8px 12px; border: 1px solid #CCC; border-radius: 4px; background: none; }
        .active-ok { background: #4A8556; color: white; border-color: #4A8556; }
        .active-nc { background: #B34033; color: white; border-color: #B34033; }
        .bottom-bar { position: fixed; bottom: 0; width: 100%; background: white; padding: 15px; border-top: 1px solid #DDD; display: flex; gap: 10px; box-sizing: border-box; }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        // --- CONFIGURACIÓN PERMANENTE ---
        const DEFAULT_CLIENT_ID = '399944808776-ndb9l3rsnv17cbrteni11n0nrmgjve7n.apps.googleusercontent.com';
        const DEFAULT_FOLDER_ID = '18KDbxt63cluSBl5rFDdSP7ZdiUzGPZPL';

        const FIXED_FOLDERS = {
            "Trimestral": "12_sPI8pZHgBUorhl4GccL77ooJGMo6p8",
            "Mensual ": "1iZ3p9b5VSHmrseOUiMDatoCbMkFVZWlD",
            "Diario-Blanchado": "1DkmsnSJrn-gMY1YccYMg9K1obO1SatdP",
            "Diario-HPS1": "1ZaFYbXVvuuJDZTYur5-4ECTB_j5-2tib",
            "Diario-HPS2": "1Rl8mEId5JipHK5K8gK9lkhMFf2XB-5Xh",
            "Diaria-Depósitos": "1d3yK6PVdz2tlL-U9XSgTbqi7cPLY0QjO",
            "Diario-Tostado-Pasta-Frito": "1ltSWK8XH9LACOcGrEND7YgGaJ4O8GMEj",
            "Diario-Planta PE II": "1EtWnvY76lh4KaVWhtOxEqTO1Qd5bFzGi",
            "Planta Tacc": "1msZpAigKWZIrfZGBhfAtWEiLlSOWLfRD"
        };

        const state = {
            view: 'home',
            sheets: [],
            activeSheet: null,
            token: localStorage.getItem('fv_token') || null,
            inspector: localStorage.getItem('fv_inspector') || ''
        };

        // --- LÓGICA ---
        function getFolder(name) { return FIXED_FOLDERS[name] || DEFAULT_FOLDER_ID; }

        function render() {
            const app = document.getElementById('app');
            app.innerHTML = '';

            // Header
            const header = document.createElement('div');
            header.className = 'header';
            header.innerHTML = `<b>MANIAGRO GVP</b> <button class="btn btn-s" style="background:#444; color:white" onclick="authenticate()">Conectar Drive</button>`;
            app.appendChild(header);

            const container = document.createElement('div');
            container.className = 'content';

            if (state.view === 'home') {
                container.innerHTML = `<h3>Seleccione Formulario</h3>`;
                Object.keys(FIXED_FOLDERS).forEach(name => {
                    const card = document.createElement('div');
                    card.className = 'sheet-card';
                    card.innerHTML = `<b>${name}</b><br><small>Carpeta: ${FIXED_FOLDERS[name].slice(0,8)}...</small>`;
                    card.onclick = () => { 
                        state.activeSheet = { name: name, items: [{id:1, eq:'Ejemplo Equipo', num:1}] }; // Aquí cargaría tu Excel
                        state.view = 'fill'; 
                        render(); 
                    };
                    container.appendChild(card);
                });
            } else {
                container.innerHTML = `<button onclick="state.view='home';render()">← Volver</button> <h2>${state.activeSheet.name}</h2>`;
                state.activeSheet.items.forEach(item => {
                    const row = document.createElement('div');
                    row.className = 'inspect-row';
                    row.innerHTML = `<span>${item.eq}</span> <div>
                        <button class="status-pill" onclick="this.classList.toggle('active-ok')">✓</button>
                        <button class="status-pill" onclick="this.classList.toggle('active-nc')">✗</button>
                    </div>`;
                    container.appendChild(row);
                });

                const footer = document.createElement('div');
                footer.className = 'bottom-bar';
                footer.innerHTML = `<button class="btn btn-accent" style="flex:1" onclick="alert('Guardando en carpeta: ' + getFolder(state.activeSheet.name))">GUARDAR EN DRIVE</button>`;
                app.appendChild(footer);
            }
            app.appendChild(container);
        }

        function authenticate() {
            const url = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${DEFAULT_CLIENT_ID}&redirect_uri=${window.location.href.split('#')[0]}&response_type=token&scope=https://www.googleapis.com/auth/drive.file`;
            window.location.href = url;
        }

        // Leer token del URL tras conectar
        const hash = window.location.hash.substring(1);
        if (hash) {
            const params = new URLSearchParams(hash);
            if (params.get('access_token')) {
                state.token = params.get('access_token');
                localStorage.setItem('fv_token', state.token);
            }
        }

        render();
    </script>
</body>
</html>
